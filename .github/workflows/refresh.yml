name: Refresh data and rebuild site

on:
  schedule:
    - cron: "17 9 * * *"   # every day at 09:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "content/**"
      - "data/videos.json"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh-site
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull fresh data (recalls, disasters, news, forecasts, videos)
        run: python3 scripts/update_data.py

      - name: Rebuild pages, sitemap, feed and search index
        run: python3 scripts/build.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "home-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily refresh: $(date -u +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push origin HEAD:main
